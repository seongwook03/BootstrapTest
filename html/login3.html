<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Modal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<div class="d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card" style="max-width: 900px; width: 100%;">
    <div class="row g-0">

      <!-- 좌측: Welcome 패널 -->
      <div class="col-6 bg-light p-5 d-flex flex-column justify-content-between">
        <div>
          <h4>환영합니다!</h4>
        </div>

        <div>
          <span class="text-muted">아직 회원가입 안하셨나요?</span>
          <a href="signin.html" class="fw-bold">회원가입</a>
        </div>
      </div>

      <!-- 우측: 로그인 폼 -->
      <div class="col-6 p-5">
        <h3 class="mb-4">로그인</h3>

        <form>
          <div class="mb-3">
            <label class="form-label small text-muted">이메일 또는 아이디</label>
            <input type="text" class="form-control" placeholder="이메일 또는 아이디">
          </div>

          <div class="mb-3">
            <label class="form-label small text-muted">비밀번호</label>
            <input type="password" class="form-control" placeholder="비밀번호">
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="keepLoggedIn">
            <label class="form-check-label" for="keepLoggedIn">
              자동 로그인
            </label>
          </div>

          <button type="submit" class="btn btn-dark w-100 mb-2">로그인 하기</button>

          <div class="text-end mb-4">
            <a href="#" class="small text-decoration-underline text-dark">비밀번호 잊으셨나요?</a>
          </div>
        </form>

        <p class="mb-2">회원가입 하기</p>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary w-100">Google</button>
          <button class="btn btn-outline-secondary w-100">Facebook</button>
          <button class="btn btn-outline-secondary w-100">Twitter</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
