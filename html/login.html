<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEST - 로그인 (아이콘 x)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Bootstrap 사용을 위한 링크 작성 -->
</head>
<body>
<div class="container" style="max-width: 420px;">
<!-- 상자 폿 제한(워하는 사이즈로 지정)-->

  <div class="d-flex justify-content-between align-items-center p-3"> <!-- 현재 시간을 왼쪽 위에 적기위한 클래스-->
    <span class="fw-bold">현제 시간</span>
    <span class="small text-muted">작동확인용</span> <!-- 글자색 연한 회색으로-->
  </div>

<!-- Bootstrap은 여백을 0~5단계로 설정-->
  <div class="d-flex justify-content-end px-3 mb-3"> <!-- 내용 오른쪽 끝 정령, 죄우 축, 아래 바깥 여백 3단계.
                                                          margin-bottom (= 바깥여백 - 아래) -->
    <button class="btn btn-outline-secondary btn-sm">한국어 ▾</button> <!-- 버튼 사용하는 클래스, 언어 선택을 보여주기 위한 버튼-->
  </div>

<!-- 로고 -->
  <div class="text-center mb-4">
    <h1 class="fw-bold">TEST</h1>
    <p class="text-muted">휠체어 최적 루트찾기</p>
  </div>

<!-- 로그인 부분을 위한 카드-->
  <div class="card p-3 mb-4">
    <div class="card-body"> <!-- 카드 안쪽을 위한 카드 body -->
      <form>
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="이메일 또는 아이디"> <!-- form-control 은 둥근모서리등을 포함하는 꾸며주는 클래스 -->
        </div>

        <div class="mb-3">
          <input type="password" class="form-control" placeholder="비밀번호">
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check"> <!-- 체크박스 클레스 -->
            <input class="form-check-input" type="checkbox" id="keepLogin">
            <label class="form-check-label" for="keepLogin">
              <!-- 이 라벨은 id="keepLogin"을 가진 체크박스와 짝을 이룸.
                   그래서 체크박스 자체가 아니라 옆의 글자(로그인 상태 유지)를
                   클릭해도 체크박스가 눌러짐(AI 추천 더 넣으면 좋을 기능) -->
              로그인 상태 유지
            </label>
          </div>
          <a href="#">아이디 / 비밀번호 찾기</a>
        </div>

        <button type="submit" class="btn btn-primary w-100">로그인</button>
      </form>

      <hr>
      <p class="text-center text-muted">또는 다른 계정으로 로그인</p>

      <button class="btn btn-outline-secondary w-100 mb-2">카카오로 로그인</button>
      <button class="btn btn-outline-secondary w-100 mb-2">네이버로 로그인</button>
      <button class="btn btn-outline-secondary w-100 mb-2">Google로 로그인</button>
    </div>
  </div>

  <div class="alert alert-light border text-center">
    아직 계정이 없으신가요?
    <a href="signin.html">회원가입 &gt;</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- Bootstrap 사용을 위한 링크 작성 -->
</body>
</html>
