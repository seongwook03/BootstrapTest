<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEST - 회원가입 (아이콘 x)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container" style="max-width: 600px;">
  <div class="d-flex justify-content-between align-items-center p-3">
    <span class="fw-bold small text-muted">현제 시간</span>
  </div>
  <div class="d-flex justify-content-end px-3 mb-3">
    <button class="btn btn-outline-secondary btn-sm">한국어 ▾</button>
  </div>
  <div class="text-center">
    <h1 class="fw-bold">TEST</h1>
    <p class="text-muted">휠체어 최적 루트찾기</p>
  </div>

  <div class="card p-5 mb-5">
    <div class="card-body">
      <form>
        <div class="input-group mb-4">
          <input type="text" class="form-control" placeholder="아이디 ">
          <button type="button"  class="btn btn-outline-secondary">중복확인</button>
        </div>

        <div class="mb-4">
          <input type="password" class="form-control" placeholder="비밀번호">
        </div>

        <div>
          <input type="email" class="form-control" placeholder="이메일">
        </div>
        <div class="input-group mb-4">
          <button type="button"  class="btn btn-outline-secondary">인증번호 전송</button>
          <input type="text" class="form-control" placeholder="인증번호 입력">
          <button type="button" class="btn btn-outline-secondary">확인</button>
        </div>

        <div>
          <input type="text" class="form-control" placeholder="주소 입력(도로명 주소 찾기로 이동)">
        </div>
        <div class="input-group mb-4">
          <input type="text" class="form-control" placeholder="상세주소 입력">
          <button type="button" class="btn btn-outline-secondary">확인</button>
        </div>

        <div class="d-grid gap-2 col-4 mx-auto">
          <button type="submit" class="btn btn-primary w-100">회원가입</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
